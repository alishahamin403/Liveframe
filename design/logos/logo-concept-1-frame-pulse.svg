<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" font-family="system-ui, -apple-system, sans-serif">
  <!-- Concept 1: Frame + Live Pulse -->
  <!-- Camera/photo frame icon -->
  <rect x="12" y="22" width="76" height="76" rx="10" ry="10" fill="none" stroke="#1a1a2e" stroke-width="5"/>
  <!-- Corner notches (disposable camera feel) -->
  <rect x="12" y="22" width="18" height="18" rx="4" fill="#1a1a2e"/>
  <rect x="70" y="22" width="18" height="18" rx="4" fill="#1a1a2e"/>
  <rect x="12" y="80" width="18" height="18" rx="4" fill="#1a1a2e"/>
  <rect x="70" y="80" width="18" height="18" rx="4" fill="#1a1a2e"/>
  <!-- Live pulse dot -->
  <circle cx="50" cy="60" r="14" fill="#ff4757"/>
  <circle cx="50" cy="60" r="20" fill="none" stroke="#ff4757" stroke-width="2" opacity="0.4"/>
  <circle cx="50" cy="60" r="27" fill="none" stroke="#ff4757" stroke-width="1.5" opacity="0.2"/>
  <!-- Wordmark -->
  <text x="104" y="55" font-size="30" font-weight="700" fill="#1a1a2e" letter-spacing="-0.5">Live</text>
  <text x="104" y="88" font-size="30" font-weight="300" fill="#1a1a2e" letter-spacing="1">Frame</text>
  <!-- LIVE badge -->
  <rect x="104" y="94" width="44" height="16" rx="3" fill="#ff4757"/>
  <text x="108" y="106" font-size="10" font-weight="700" fill="white" letter-spacing="1.5">LIVE</text>
</svg>
