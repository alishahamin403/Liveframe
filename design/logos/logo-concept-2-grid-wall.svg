<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" font-family="system-ui, -apple-system, sans-serif">
  <!-- Concept 2: Photo grid wall icon -->
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
  </defs>
  <!-- 3x3 photo grid (the "wall") -->
  <rect x="10" y="20" width="22" height="22" rx="3" fill="url(#g1)" opacity="0.9"/>
  <rect x="36" y="20" width="22" height="22" rx="3" fill="url(#g1)" opacity="0.6"/>
  <rect x="62" y="20" width="22" height="22" rx="3" fill="url(#g1)" opacity="0.4"/>
  <rect x="10" y="46" width="22" height="22" rx="3" fill="url(#g1)" opacity="0.5"/>
  <rect x="36" y="46" width="22" height="22" rx="3" fill="url(#g1)" opacity="1"/>
  <rect x="62" y="46" width="22" height="22" rx="3" fill="url(#g1)" opacity="0.7"/>
  <rect x="10" y="72" width="22" height="22" rx="3" fill="url(#g1)" opacity="0.3"/>
  <rect x="36" y="72" width="22" height="22" rx="3" fill="url(#g1)" opacity="0.8"/>
  <rect x="62" y="72" width="22" height="22" rx="3" fill="url(#g1)" opacity="1"/>
  <!-- Live dot on top-right tile -->
  <circle cx="80" cy="24" r="6" fill="#00cec9"/>
  <!-- Wordmark -->
  <text x="100" y="58" font-size="36" font-weight="800" fill="#2d3436" letter-spacing="-1">LiveFrame</text>
  <text x="101" y="78" font-size="13" font-weight="400" fill="#636e72" letter-spacing="3">FOR VENUES</text>
</svg>
