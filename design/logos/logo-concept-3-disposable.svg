<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" font-family="system-ui, -apple-system, sans-serif">
  <!-- Concept 3: Disposable camera silhouette, warm tones -->
  <defs>
    <linearGradient id="warm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fd9644"/>
      <stop offset="100%" style="stop-color:#e55039"/>
    </linearGradient>
  </defs>
  <!-- Camera body -->
  <rect x="10" y="35" width="74" height="50" rx="8" fill="url(#warm)"/>
  <!-- Viewfinder bump -->
  <rect x="28" y="24" width="22" height="14" rx="4" fill="url(#warm)"/>
  <!-- Lens circle -->
  <circle cx="47" cy="60" r="16" fill="white" opacity="0.15"/>
  <circle cx="47" cy="60" r="11" fill="white" opacity="0.25"/>
  <circle cx="47" cy="60" r="6"  fill="white" opacity="0.9"/>
  <!-- Flash bar -->
  <rect x="10" y="35" width="14" height="50" rx="8" fill="#e55039"/>
  <!-- QR hint lines (tiny) on flash bar -->
  <line x1="14" y1="52" x2="20" y2="52" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="14" y1="56" x2="20" y2="56" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="14" y1="60" x2="20" y2="60" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="14" y1="64" x2="20" y2="64" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="14" y1="68" x2="20" y2="68" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- Wordmark -->
  <text x="96" y="52" font-size="28" font-weight="800" fill="#2d3436">Live</text>
  <text x="96" y="82" font-size="28" font-weight="300" fill="#2d3436" letter-spacing="2">Frame</text>
  <!-- Tagline -->
  <text x="97" y="99" font-size="10" fill="#fd9644" letter-spacing="1" font-weight="600">SHARED DISPOSABLE · LIVE WALL</text>
</svg>
